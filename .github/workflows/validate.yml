name: Validate and build JAR
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-and-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: scripts/test-java-core.sh
      - run: python -m unittest discover -s tests -v
  fabric-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Compile and test Fabric mod
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain build 2>&1 | tee build-output.log
      - name: Install client test graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-vulkan-drivers
      - name: Run real Minecraft client tests
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: |
          mkdir -p build/client-gametest
          printf 'preferredGraphicsBackend:"opengl"\n' > build/client-gametest/options.txt
          set -o pipefail
          for trial in 1 2; do
            echo "ApexCraft client validation trial $trial" | tee -a build-output.log
            xvfb-run -a ./gradlew --no-daemon --console=plain runClientGametest 2>&1 | tee -a build-output.log
          done
          test "$(grep -c 'APEXCRAFT_CLIENT_TESTS_PASSED:' build-output.log)" -eq 2
      - name: Include Baritone corresponding source
        run: |
          curl --fail --location --retry 3 https://github.com/cabaletta/baritone/archive/refs/tags/v1.20.0.tar.gz -o build/dependencies/baritone-source-v1.20.0.tar.gz
          echo 'bd2fd8b8e4e7c9863565048516ae0cd57ed9974052ce6833aacd781873cdeda7  build/dependencies/baritone-source-v1.20.0.tar.gz' | sha256sum --check
      - name: Verify packaged mod
        shell: python
        run: |
          import hashlib, json, zipfile
          from pathlib import Path
          jars = [p for p in Path('build/libs').glob('apexcraft-*.jar') if not p.name.endswith('-sources.jar')]
          assert len(jars) == 1, f'Expected one mod JAR, got {jars}'
          jar = jars[0]
          with zipfile.ZipFile(jar) as archive:
              metadata = json.loads(archive.read('fabric.mod.json'))
              assert metadata['id'] == 'apexcraft'
              assert '${' not in metadata['version'], 'Unexpanded mod version'
              assert 'LICENSE' in archive.namelist()
              for entrypoint in metadata['entrypoints']['client']:
                  assert entrypoint.replace('.', '/') + '.class' in archive.namelist(), entrypoint
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          jar.with_suffix('.jar.sha256').write_text(digest + '  ' + jar.name + '\n')
          print(f'Verified {jar.name}: {digest}')
          dependency = Path('build/dependencies/baritone-unoptimized-fabric-1.20.0.jar')
          assert hashlib.sha256(dependency.read_bytes()).hexdigest() == '7836a235f37339897425ec303b5c0d7f3cf9d99dbdaa1952240b5099aafd8776'
          with zipfile.ZipFile(dependency) as archive:
              assert 'baritone/utils/BlockBreakHelper.class' in archive.namelist()
          with zipfile.ZipFile(jar) as archive:
              assert 'apexcraft.client.mixins.json' in archive.namelist()
              assert 'dev/apexcraft/client/mixin/BaritoneMouseInputMixin.class' in archive.namelist()
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: ApexCraft-Fabric-26.3
          path: |
            build/libs/apexcraft-*.jar
            !build/libs/*-sources.jar
            build/libs/*.jar.sha256
            build/dependencies/*
          if-no-files-found: error
          retention-days: 30
      - name: Report compiler diagnostics
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          import os
          path = Path('build-output.log')
          sections = []
          for crash in list(Path('.').rglob('crash-*.txt'))[-2:]:
              sections.append('CRASH REPORT ' + str(crash) + '\n' + '\n'.join(line[:500] for line in crash.read_text(errors='replace').splitlines()[:80]))
          if path.exists():
              lines = path.read_text(errors='replace').splitlines()
              selected = set(range(max(0, len(lines)-20), len(lines)))
              for i, line in enumerate(lines):
                  if len(line) < 3000 and any(key in line for key in ('ERROR', 'Exception', 'Caused by:', 'AssertionError', 'APEXCRAFT_CLIENT_', '[PLAN]', 'error:', 'BUILD FAILED')):
                      selected.update(range(max(0,i-1), min(len(lines),i+8)))
              sections.append('LOG CONTEXT\n' + '\n'.join(lines[i][:500] for i in sorted(selected)))
          report = '\n\n'.join(sections)[:25000]
          for start in range(0, len(report), 2500):
              chunk = report[start:start+2500]
              escaped = chunk.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Client build diagnostics ' + str(start//2500+1) + '::' + escaped)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Diagnostics\n\n```text\n' + report + '\n```\n')
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-build-diagnostics
          path: |
            build-output.log
            build/client-gametest/crash-reports/
            build/client-gametest/logs/

          if-no-files-found: ignore
