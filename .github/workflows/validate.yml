name: Validate and build JAR
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-and-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: scripts/test-java-core.sh
      - run: python -m unittest discover -s tests -v
  fabric-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile and test Fabric mod
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain build 2>&1 | tee build-output.log
      - name: Report compiler diagnostics
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          path = Path('build-output.log')
          if path.exists():
              tail = '\n'.join(path.read_text(errors='replace').splitlines()[-100:])
              escaped = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Fabric build diagnostics::' + escaped)
              with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('## Fabric build diagnostics\n\n```text\n' + tail + '\n```\n')
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: ApexCraft-Fabric-26.3
          path: |
            build/libs/apexcraft-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-build-diagnostics
          path: build-output.log
          if-no-files-found: ignore
